name: CI Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_target: [esp32, esp32s3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up ESP-IDF
        uses: espressif/setup-esp-idf@v1
        with:
          esp_idf_version: v5.1

      - name: Build firmware
        run: |
          idf.py set-target ${{ matrix.idf_target }}
          idf.py build

      - name: Build unit tests
        working-directory: test/unit_test
        run: |
          idf.py set-target ${{ matrix.idf_target }}
          idf.py build

      - name: Run Unity unit tests (host)
        working-directory: test/unit_test
        run: |
          idf.py test || true  # Run Unity tests in host mode; tolerate failure if no tests tagged for host

      - name: Static analysis (clang-tidy)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy
          run-clang-tidy -p build || true

      - name: Run stress tests
        run: |
          python scripts/run_stress_tests.py || true  # Tolerate failures for now

      - name: Export KPI metrics (build-only)
        run: |
          echo "NOTE: Metrics export requires running on target hardware. CI currently builds only."
          ls -la build || true

      - name: Archive KPI metrics (if present)
        uses: actions/upload-artifact@v3
        with:
          name: metrics-${{ matrix.idf_target }}
          path: build/metrics.prom
          if-no-files-found: ignore

      - name: Archive firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: firmware-${{ matrix.idf_target }}
          path: build/*.bin

      - name: Archive unit-test ELF
        uses: actions/upload-artifact@v3
        with:
          name: unit_test-${{ matrix.idf_target }}
          path: test/unit_test/build/*.elf

      - name: Generate Doxygen docs
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          doxygen Doxyfile

      - name: Archive Doxygen HTML
        uses: actions/upload-artifact@v3
        with:
          name: doxygen-html-${{ matrix.idf_target }}
          path: docs/doxygen/html
          if-no-files-found: error

      - name: Generate PlantUML diagrams
        run: |
          sudo apt-get update && sudo apt-get install -y plantuml graphviz
          mkdir -p docs/arch/out
          plantuml -tpng -o out docs/arch/*.puml

      - name: Archive Architecture Diagrams
        uses: actions/upload-artifact@v3
        with:
          name: arch-diagrams-${{ matrix.idf_target }}
          path: docs/arch/out
          if-no-files-found: error
